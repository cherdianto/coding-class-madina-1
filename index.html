<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Madina United Training Session</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col">
  <a href="/admin.html" aria-label="Admin dashboard"
    class="fixed bottom-4 right-4 z-10 w-11 h-11 rounded-full bg-emerald-700 text-white shadow-md flex items-center justify-center focus:outline-none focus:ring-2 focus:ring-emerald-600 focus:ring-offset-2">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 20a8 8 0 1 0 0-16 8 8 0 0 0 0 16Z"/>
      <path d="M12 14a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z"/>
      <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
    </svg>
  </a>

  <main class="flex-1 w-full max-w-lg mx-auto px-4 py-6 space-y-6">

    <!-- Header / schedule -->
    <section class="bg-emerald-700 text-white rounded-2xl p-5 shadow-sm">
      <h1 class="text-xl font-bold">Madina United</h1>
      <p class="text-emerald-100">Training Session</p>

      <div id="schedule-info" class="mt-4 space-y-1 text-sm">
        <p class="text-emerald-100">Loading schedule…</p>
      </div>

      <div id="status-badge" class="mt-4 inline-flex items-center gap-2 bg-white/15 rounded-full px-3 py-1 text-sm font-medium">
        <span class="w-2 h-2 rounded-full bg-slate-300"></span>
        <span>Loading status…</span>
      </div>
    </section>

    <!-- Registration form -->
    <section class="bg-white rounded-2xl p-5 shadow-sm">
      <h2 class="text-lg font-semibold mb-4">Register</h2>

      <div id="form-message" class="hidden mb-4 rounded-lg px-3 py-2 text-sm"></div>

      <form id="registration-form" class="space-y-4">
        <div>
          <label for="name" class="block text-sm font-medium mb-1">Name</label>
          <input id="name" name="name" type="text" required maxlength="80"
            class="w-full rounded-lg border border-slate-300 px-3 py-3 text-base focus:outline-none focus:ring-2 focus:ring-emerald-600" />
        </div>

        <div>
          <label for="whatsapp" class="block text-sm font-medium mb-1">WhatsApp</label>
          <input id="whatsapp" name="whatsapp" type="tel" required maxlength="30" placeholder="08123456789"
            class="w-full rounded-lg border border-slate-300 px-3 py-3 text-base focus:outline-none focus:ring-2 focus:ring-emerald-600" />
        </div>

        <div>
          <label for="position" class="block text-sm font-medium mb-1">Position</label>
          <select id="position" name="position" required
            class="w-full rounded-lg border border-slate-300 px-3 py-3 text-base focus:outline-none focus:ring-2 focus:ring-emerald-600">
            <option value="">Loading options…</option>
          </select>
        </div>

        <button id="submit-btn" type="submit"
          class="w-full rounded-lg bg-emerald-700 text-white font-semibold py-3 text-base disabled:opacity-50 disabled:cursor-not-allowed">
          Submit Registration
        </button>
      </form>

      <p id="closed-message" class="hidden text-center text-sm text-slate-500 py-2">
        Registration is currently closed.
      </p>
    </section>

    <!-- Registered players -->
    <section class="bg-white rounded-2xl p-5 shadow-sm">
      <h2 class="text-lg font-semibold mb-4">Registered Player</h2>
      <div id="player-lists" class="space-y-6">
        <p class="text-sm text-slate-500">Loading registrations…</p>
      </div>
    </section>

  </main>

  <footer class="text-center text-xs text-slate-400 py-6">
    webcreatia
  </footer>

  <script src="/js/whatsapp-format.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
